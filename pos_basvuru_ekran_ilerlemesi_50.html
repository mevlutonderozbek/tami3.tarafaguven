function setSelectByValue(hedef, val, txt){
  if(!hedef) return;
  if(!val){ hedef.value=''; return; }
  let found=false;
  for(const opt of hedef.options){ if(opt.value===val){ found=true; break; } }
  if(!found){
    const o=document.createElement('option');
    o.value=val; o.textContent=txt || val; hedef.appendChild(o);
  }
  hedef.value=val;
}

  const btn = document.getElementById('btnKontrol');

function setGvField(k){
  const f=gvField(k);
  if(!f) return;
  if(f.tagName==='SELECT'){
    let found=false;
    for(const opt of f.options){ if(opt.value===GV_MOCK[k]){found=true;break;} }
    if(!found){
      const o=document.createElement('option');
      o.value=GV_MOCK[k]; o.textContent=GV_LABEL[k]; f.appendChild(o);
    }
    f.value=GV_MOCK[k];
  } else {
    f.value=GV_MOCK[k];
  }
}

function applyGv(k){
  setGvField(k);
  // Adres Detay için Kullan basılınca Adres Tipi, İl ve İlçe de otomatik dolar
  if(k==='ad'){ GV_ADDR_EXTRA.forEach(setGvField); GV_ADDR_EXTRA.forEach(syncGvBadge); }
  syncGvBadge(k);
  updateGvBtn(k);
}

function updateGvBtn(k){
  const f=gvField(k);
  const btn=document.querySelector('#gvs-'+k+' .gv-btn');
  if(!f||!btn) return;
  const cur = f.tagName==='SELECT' ? f.value : f.value;
  if(cur===GV_MOCK[k]){ btn.textContent='✓ Uygulandı'; btn.className='gv-btn applied'; }
  else { btn.textContent='Kullan'; btn.className='gv-btn'; }
}

function bindGaranti(){
  GV_BADGE_KEYS.forEach(k=>{
    const f=gvField(k);
    if(f && !f.dataset.gvBound){
      f.dataset.gvBound='1';
      const ev = f.tagName==='SELECT' ? 'change' : 'input';
      f.addEventListener(ev, ()=>{
        const cons=document.getElementById('gvConsent');
        if(cons && cons.checked){
          syncGvBadge(k);
          if(GV_UI_KEYS.includes(k)) updateGvBtn(k);
        }
      });
    }
  });
}

  });
  // Belge onay ve diğer tüm checkbox'ları pasifleştir
  const belgeChk = document.getElementById('belgeConsentChk');
  if (belgeChk) {
    belgeChk.disabled = true;
    const l = belgeChk.closest('label');
    if (l) l.style.opacity = '0.6';
  }
  // Ekranın tamamını dokunulamaz hale getir (version bar hariç)
  const stepRoot = document.getElementById('stepper');
  if (stepRoot && stepRoot.firstElementChild) {
    const root = stepRoot.firstElementChild;
    root.querySelectorAll('input, select, textarea, button').forEach(el => { el.disabled = true; });
    root.style.pointerEvents = 'none';
    root.style.opacity = '0.7';
    // Version bar tıklanabilir kalsın
    const verSpan = root.querySelector('span[onclick="resetToHome()"]');
    if (verSpan) {
      const verBar = verSpan.parentElement;
      if (verBar) {
        verBar.style.pointerEvents = 'auto';
        verBar.style.opacity = '1';
      }
    }
  }
}
render();
</script>
</body>
</html>
